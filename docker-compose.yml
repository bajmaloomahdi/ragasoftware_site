name: ragasoftware_site

services:
  mysql:
    image: mysql:8.0
    container_name: raga_mysql
    command: --default-authentication-plugin=caching_sha2_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-ragasoftware}"
      MYSQL_USER: "${DB_USERNAME:-raga}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-raga_secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_secret}"
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [raga]

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    container_name: raga_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      # Override host-oriented .env so the container talks to the mysql service
      DB_HOST: mysql
      DB_PORT: "3306"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [raga]

  nginx:
    image: nginx:alpine
    container_name: raga_nginx
    ports:
      - "${APP_FORWARD_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [raga]

  vite:
    image: node:22-alpine
    container_name: raga_vite
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./:/var/www/html
    environment:
      CHOKIDAR_USEPOLLING: "true"
    networks: [raga]

  adminer:
    image: adminer:latest
    container_name: raga_adminer
    ports:
      - "${ADMINER_FORWARD_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on: [mysql]
    networks: [raga]

volumes:
  db_data:

networks:
  raga:
    driver: bridge
