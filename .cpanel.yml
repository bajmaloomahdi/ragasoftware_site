---
# cPanel Git™ deployment — Route B (2026-09).
#
# The domain's Document Root is FIXED by the host at
#     /home/ragasoftwareir/public_html
# and cannot be pointed at <repo>/public (the usual Laravel requirement).
# So the application source (app/, bootstrap/, config/, database/, resources/,
# routes/, storage/, vendor/, .env, composer.json, …) stays inside this Git
# checkout — /home/ragasoftwareir/repositories/ragasoftware_site — which is
# NOT below any Document Root and is therefore never web-accessible. Only
# public/'s contents are made reachable at the fixed Document Root, via
# symlinks (build, uploads, favicon.ico, .htaccess) plus a generated
# index.php that points at this checkout by absolute path — all rebuilt by
# bin/deploy.sh on every deploy, so the split can never drift or go stale.
#
# Runs ONLY when you click "Deploy HEAD Commit" in cPanel → Git Version
# Control (a plain `git pull` does NOT run these tasks). Tasks execute with
# cwd = this repository checkout, which is why bin/deploy.sh is invoked with
# a path relative to it.
deployment:
  tasks:
    - /bin/bash bin/deploy.sh
